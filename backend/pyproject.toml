# Configuração do backend (dependências, versão do Python e do pytest).
# Instalação (dentro de backend/):  .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rpg-engine-backend"
version = "0.1.0"
description = "Backend do AI RPG Engine: API, motor de RPG, orquestração de IA e persistência."
requires-python = ">=3.12"
# Dependências de execução entram aqui conforme cada subtarefa precisar delas.
dependencies = [
    "flask>=3.1",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Ferramentas usadas só no desenvolvimento.
dev = [
    "pytest>=8",
]
# Servidor para hospedagem em Linux (usado pelo Dockerfile). Em casa não é preciso.
hosting = [
    "gunicorn>=23",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: permite arquivos de teste com o mesmo nome em pastas diferentes (unit/, integration/).
addopts = "-ra --strict-markers --import-mode=importlib -m 'not external'"
markers = [
    "external: chama um provedor de IA real (internet/custo); não roda por padrão. Use: pytest -m external",
]
